name: Custom Release (GHCR)

# Trigger cho MỌI tag đẩy lên (tag tự đặt hoặc tag sync từ upstream).
# LƯU Ý: tag phải đúng format semver mà prepare-release action yêu cầu:
#   v1.2.3 | v1.2.3-beta.1 | v1.2.3-canary.<hash>
# Tag không đúng format sẽ làm job fail ngay ở bước "Prepare Release".
on:
  push:
    tags:
      - '*'
  # Chạy manual: nhớ chọn tag ở ô "Use workflow from" trước khi bấm Run.
  # Chọn tag có sẵn -> version tính như push tag bình thường.
  # Chọn branch -> tự sinh version dạng canary theo ngày giờ chạy.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Đổi thành namespace GHCR của mày nếu muốn tên khác "affine"
  IMAGE_NAME: ghcr.io/thanhtinh88/affine

jobs:
  gate:
    name: Gate (chỉ cho tag mới nhất chạy tiếp)
    runs-on: ubuntu-latest
    outputs:
      IS_LATEST: ${{ steps.check.outputs.IS_LATEST }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check if this tag is the newest one
        id: check
        run: |
          # Sắp theo thời gian tạo tag (creatordate), không sort theo tên
          # vì tag canary dạng v0.x.x-canary.<hash> không so semver được.
          LATEST_TAG=$(git for-each-ref refs/tags --sort=-creatordate --format='%(refname:short)' | head -n1)
          echo "Latest tag in repo: $LATEST_TAG"
          echo "Current ref tag:    ${{ github.ref_name }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run -> luôn cho chạy"
            echo "IS_LATEST=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST_TAG" == "${{ github.ref_name }}" ]; then
            echo "IS_LATEST=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag này không phải mới nhất -> skip build"
            echo "IS_LATEST=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.IS_LATEST == 'true'
    outputs:
      APP_VERSION: ${{ steps.prepare.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.prepare.outputs.GIT_SHORT_HASH }}
      BUILD_TYPE: ${{ steps.prepare.outputs.BUILD_TYPE }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Release
        id: prepare
        uses: ./.github/actions/prepare-release

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      - uses: ./.github/actions/setup-node
      - name: Build Web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.BUILD_TYPE }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build @affine/admin
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      - uses: ./.github/actions/setup-node
      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.BUILD_TYPE }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build @affine/mobile
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      - uses: ./.github/actions/setup-node
      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.BUILD_TYPE }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build Server native (x86_64)
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'
      - name: Rename artifact
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node
      - uses: actions/upload-artifact@v4
        with:
          name: server-native-x64
          path: ./packages/backend/native/server-native.x64.node
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-server-native
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env
      - uses: actions/download-artifact@v4
        with:
          name: server-native-x64
          path: ./packages/backend/native
      - name: Stub unused native archs (rspack resolves all require() branches statically)
        run: |
          touch ./packages/backend/native/server-native.arm64.node
          touch ./packages/backend/native/server-native.armv7.node
      - name: Build Server
        run: yarn workspace @affine/server build
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-web
      - build-admin
      - build-mobile
      - build-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
      - uses: actions/download-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
      - uses: actions/download-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Không dùng cache config để tránh xung đột với Prisma
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@toeverything'

      - name: Install production deps
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules
        run: mv ./node_modules ./packages/backend/server

      - uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.APP_VERSION }}

      - name: Build & Push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          file: .github/deployment/node/Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.BUILD_TYPE }}